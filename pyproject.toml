[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentops"
version = "0.1.0"
description = "AgentOps: AI Business Intelligence & Decision Agent (portfolio project)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Maya Sukumar" }]
requires-python = ">=3.11"
# Dependencies are added phase by phase; only what the implemented phases use is listed.
dependencies = [
    "duckdb>=1.5,<2",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    # Phase 3: ETS(A,Ad,N) with analytic prediction intervals (statsmodels) and t tail probabilities (scipy).
    # statsmodels 0.15 is the release tested with pandas 3.
    "scipy>=1.13,<2",
    "sqlglot>=25",
    "statsmodels>=0.15,<0.16",
    # Phase 4: the agent's state machine. langchain-core comes in transitively; no other LangChain packages are used.
    "langgraph>=1.2,<2",
    # Phase 6: the official Model Context Protocol SDK (low-level server, stdio transport, client for tests).
    "mcp>=2.2,<3",
]

[project.scripts]
# Phase 6: the local MCP server (stdio). Equivalent to `python -m app.mcp`.
agentops-mcp = "app.mcp.__main__:main"

[project.optional-dependencies]
# Phase 4: optional network LLM provider (LLM_PROVIDER=anthropic). The default deterministic provider needs nothing.
anthropic = ["anthropic>=1.0"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*", "data", "data.generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "full_data: runs against the full generated database (skipped when it has not been built)",
    "slow: tests that generate a medium-sized dataset",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Markdown tables in the rendered data dictionary and evaluation report cannot be wrapped.
"app/database/data_dictionary.py" = ["E501"]
"evals/reports/writer.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
