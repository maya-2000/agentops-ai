# Pull-request and main-branch validation. Deterministic: no API keys, no network model, no pre-built data.
#
#   checks      ruff, ruff format, mypy and the full pytest suite (the suite builds its own datasets)
#   evaluation  generate the dataset and run the 13-scenario critical benchmark suite
#   docker      build both images, start them with docker compose, run the deployment smoke test, and
#               check that a SIGTERM stops both containers cleanly
#
# The full 89-scenario benchmark and the multi-seed check run in evaluation.yml (main, weekly, on demand).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  LLM_PROVIDER: deterministic

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app data tests evals scripts
      - name: Ruff format
        run: ruff format --check app data tests evals scripts
      - name: Mypy
        run: mypy app data evals
      - name: Pytest
        run: pytest -q

  evaluation:
    name: Critical benchmark suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e .
      - name: Generate the dataset
        run: python -m data.generator.generate
      - name: Critical suite (13 scenarios)
        run: python -m evals.run --suite critical --output reports/evaluation
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-critical
          path: reports/evaluation/
          if-no-files-found: ignore

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the generator and the smoke-test client
        run: python -m pip install -e . "httpx>=0.27"
      - name: Generate the dataset (mounted read-only into the API container)
        run: python -m data.generator.generate
      - name: Create an ephemeral API token
        run: |
          token="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::${token}"
          echo "API_AUTH_TOKEN=${token}" >> "$GITHUB_ENV"
      - name: Build the images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test
        run: python scripts/smoke_test.py --api-url http://127.0.0.1:8000 --ui-url http://127.0.0.1:8501
      - name: Graceful shutdown
        run: |
          docker compose stop
          for c in $(docker compose ps -a -q); do
            code="$(docker inspect -f '{{.State.ExitCode}}' "$c")"
            echo "$(docker inspect -f '{{.Name}}' "$c") exited with ${code}"
            test "${code}" = "0"
          done
          docker compose logs api | grep -q '"event": "service_stopped"'
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color | tail -n 200
      - name: Tear down
        if: always()
        run: docker compose down -v
