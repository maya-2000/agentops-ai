# The full evaluation: the 89-scenario benchmark (regression thresholds enforced) and the multi-seed check
# (seeds 7 and 2027). Slower than the PR checks, so it runs on main, weekly and on demand.
# Deterministic: no API keys, no network model.

name: Evaluation

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Full benchmark and multi-seed check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLM_PROVIDER: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e .
      - name: Generate the dataset
        run: python -m data.generator.generate
      - name: Full benchmark (89 scenarios)
        run: python -m evals.run --output reports/evaluation
      - name: Critical suite (13 scenarios)
        run: python -m evals.run --suite critical --output reports/evaluation
      - name: Multi-seed (seeds 7 and 2027)
        run: python -m evals.run --suite multi_seed --multi-seed 7,2027 --output reports/evaluation
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: reports/evaluation/
          if-no-files-found: ignore
